# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
set -s escape-time 0
set -g base-index 1
set -g allow-passthrough on

# pane navigation (via Cmd+arrows in Ghostty)
bind-key h select-pane -L
bind-key l select-pane -R
bind-key u select-pane -U
bind-key b select-pane -D

# pane resizing (no prefix)
bind -n M-H resize-pane -L 5
bind -n M-L resize-pane -R 5
bind -n M-U resize-pane -U 5
bind -n M-D resize-pane -D 5

set-option -g allow-rename off

# F12: toggle this (outer) tmux off -> keys pass through to a nested/remote tmux.
# use with sesh "box (persist)" so cmd+ binds drive the remote directly, no double-prefix.
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set status off \;\
  refresh-client -S
bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status \;\
  refresh-client -S

set-option -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ',xterm-256color:RGB'

bind-key x kill-pane
set -g detach-on-destroy off

# splits (current directory)
bind-key v split-window -h -c "#{pane_current_path}"
bind-key S split-window -v -c "#{pane_current_path}"
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# pane swapping
bind-key > swap-pane -D
bind-key < swap-pane -U

# new session
bind-key N new-session

# copy mode search
bind-key F copy-mode \; send-keys /

# popup defaults (rounded border, no bg fill - inherit terminal bg)
set -g popup-border-lines rounded
set -g popup-style "bg=default"
set -g popup-border-style "fg=#7aa2f7"

# help popup (amber)
bind-key ? display-popup -E -w 60% -h 80% \
  -T " 📖 keybinds " -S "fg=#e0af68" -s "bg=default" \
  "glow -p ~/.config/tmux/scripts/keybinds.md"

# sesh picker (blue) - gum spin shows loading dots while sesh enumerates sessions
bind-key "k" display-popup -E -w 80% \
  -T " ⚡ sesh " -S "fg=#7aa2f7" -s "bg=default" \
  "sesh connect \"\$(
    GUM_SPIN_SPINNER_FOREGROUND='#7aa2f7' GUM_SPIN_PADDING='1 2' \
      gum spin --spinner dot --title 'loading sessions...' --show-output -- sesh list -i \
    | GUM_FILTER_INDICATOR_FOREGROUND='#7aa2f7' GUM_FILTER_MATCH_FOREGROUND='#bb9af7' GUM_FILTER_PADDING='1 2' \
      gum filter --no-strip-ansi --limit 1 --no-sort --fuzzy --placeholder 'Pick a sesh' --height 50 --prompt='⚡ '
  )\""

# new worktree (green)
bind-key "j" display-popup -E -w 60% -h 40% \
  -T " 🌳 worktree " -S "fg=#9ece6a" -s "bg=default" \
  "~/.config/tmux/scripts/new-worktree.sh"

set -g @minimal-tmux-bg "#1b1c36"
set -g @minimal-tmux-fg "#FFFFFF"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'niksingh710/minimal-tmux-status'

set -g status-interval 5
set -g @minimal-tmux-status-right-extra '#(echo #(PANE_CURRENT_PATH))'

set -g @minimal-tmux-justify "left"
set -g @minimal-tmux-use-arrow true
set -g @minimal-tmux-right-arrow ""
set -g @minimal-tmux-left-arrow ""
set -g @minimal-tmux-status "top"
set -g @minimal-tmux-left false
set -g @minimal-tmux-right true

# rename version-number windows (e.g. claude code shows as "2.1.72")
set-hook -g window-renamed 'if-shell "echo \"#{window_name}\" | grep -qE \"^[0-9]+\\.[0-9]+\\.[0-9]+$\"" "rename-window \"🤖 Claude\"; set-option -w automatic-rename off"'

run '~/.tmux/plugins/tpm/tpm'
