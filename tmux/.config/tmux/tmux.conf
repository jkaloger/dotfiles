# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
set -s escape-time 0
set -g base-index 1
set -g allow-passthrough on

# pane navigation (via Cmd+arrows in Ghostty)
bind-key h select-pane -L
bind-key l select-pane -R
bind-key u select-pane -U
bind-key b select-pane -D

# pane resizing (no prefix)
bind -n M-H resize-pane -L 5
bind -n M-L resize-pane -R 5
bind -n M-U resize-pane -U 5
bind -n M-D resize-pane -D 5

set-option -g allow-rename off

set-option -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ',xterm-256color:RGB'

bind-key x kill-pane
set -g detach-on-destroy off

# splits (current directory)
bind-key v split-window -h -c "#{pane_current_path}"
bind-key S split-window -v -c "#{pane_current_path}"
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# pane swapping
bind-key > swap-pane -D
bind-key < swap-pane -U

# new session
bind-key N new-session

# copy mode search
bind-key F copy-mode \; send-keys /

# help popup
bind-key ? display-popup -E -w 60% -h 80% "glow -p ~/.config/tmux/scripts/keybinds.md"

bind-key "k" display-popup -E -w 80% "sesh connect \"$(
 sesh list -i | gum filter --no-strip-ansi --limit 1 --no-sort --fuzzy --placeholder 'Pick a sesh' --height 50 --prompt='⚡'
)\""

bind-key "j" display-popup -E -w 60% -h 40% "~/.config/tmux/scripts/new-worktree.sh"

set -g @minimal-tmux-bg "#1b1c36"
set -g @minimal-tmux-fg "#FFFFFF"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'niksingh710/minimal-tmux-status'

set -g status-interval 5
set -g @minimal-tmux-status-right-extra '#(echo #(PANE_CURRENT_PATH))'

set -g @minimal-tmux-justify "left"
set -g @minimal-tmux-use-arrow true
set -g @minimal-tmux-right-arrow ""
set -g @minimal-tmux-left-arrow ""
set -g @minimal-tmux-status "top"
set -g @minimal-tmux-left false
set -g @minimal-tmux-right true

# rename version-number windows (e.g. claude code shows as "2.1.72")
set-hook -g window-renamed 'if-shell "echo \"#{window_name}\" | grep -qE \"^[0-9]+\\.[0-9]+\\.[0-9]+$\"" "rename-window \"🤖 Claude\"; set-option -w automatic-rename off"'

run '~/.tmux/plugins/tpm/tpm'
