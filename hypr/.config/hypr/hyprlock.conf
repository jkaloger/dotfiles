# macOS-style hyprlock config
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace

$font = Jetbrains Mono

general {
    hide_cursor = false
    grace = 0
}

animations {
    enabled = true
    bezier = macos, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 3, macos
    animation = fadeOut, 1, 3, macos
    animation = inputFieldDots, 1, 2, macos
}

$fg = rgb(ffffff)
$fg-dim = rgba(ffffff, 0.65)
$field = rgba(255, 255, 255, 0.12)
$field-outline = rgba(255, 255, 255, 0.35)
$fail = rgb(ff453a)

background {
    monitor =
    path = /home/jack/Pictures/majo002.jpg
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
    noise = 0.01
}

# clock, large centered upper third
label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 92
    font_family = $font

    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $fg-dim
    font_size = 22
    font_family = $font

    position = 0, 40
    halign = center
    valign = center
}

# username, sits just above input field
label {
    monitor =
    text = $USER
    color = $fg
    font_size = 18
    font_family = $font

    position = 0, 60
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 260, 46
    outline_thickness = 1
    dots_size = 0.3
    dots_spacing = 0.25
    inner_color = $field
    outer_color = $field-outline
    check_color = $fg
    fail_color = $fail

    font_color = $fg
    fade_on_empty = false
    rounding = 23

    font_family = $font
    placeholder_text = Enter Password
    fail_text = Wrong Password

    position = 0, -40
    halign = center
    valign = center
}
