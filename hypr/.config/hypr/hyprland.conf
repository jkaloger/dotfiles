source = ~/.config/hypr/spaceduck.conf

monitor = ,3440x1440@165.0hz,auto,auto

$terminal = ghostty
# pkill first so SUPER+SPACE toggles; fuzzel reads ~/.config/fuzzel/fuzzel.ini by default
$menu = pkill fuzzel || fuzzel
$mainMod = ALT

exec-once = hyprpaper
exec-once = waybar
exec-once = hyprsunset
exec-once = hypridle
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = wl-paste --watch cliphist store
exec-once = gsettings set org.gnome.desktop.interface color-scheme prefer-dark
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark'

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

general {
    gaps_in = 5
    gaps_out = 20
    border_size = 2
    col.active_border = $purple $cyan 45deg
    col.inactive_border = $darkPurple
    layout = dwindle
}

cursor {
    warp_on_change_workspace = true
}

decoration {
    rounding = 15
    inactive_opacity = 0.8

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, please :)

    bezier = easeOutQuint, 0.23, 1,   0.32, 1
    bezier = linear,       0,    0,   1,    1
    bezier = almostLinear, 0.5,  0.5, 0.75, 1
    bezier = quick,        0.15, 0,   0.1,  1

    animation = global,        1, 10,   default
    animation = border,        1, 5.39, easeOutQuint
    animation = windows,       1, 4.79, easeOutQuint
    animation = windowsIn,     1, 4.1,  easeOutQuint, popin 87%
    animation = windowsOut,    1, 1.49, linear,       popin 87%
    animation = fadeIn,        1, 1.73, almostLinear
    animation = fadeOut,       1, 1.46, almostLinear
    animation = fade,          1, 3.03, quick
    animation = layers,        1, 3.81, easeOutQuint
    animation = layersIn,      1, 4,    easeOutQuint, fade
    animation = layersOut,     1, 1.5,  linear,       fade
    animation = fadeLayersIn,  1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces,    1, 1.94, almostLinear, fade
    animation = workspacesIn,  1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
    animation = zoomFactor,    1, 7,    quick
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

input {
    kb_layout = us
    follow_mouse = 0
    # match KDE kcminputrc: PointerAcceleration=-0.800, defaults otherwise
    sensitivity = -0.8
    natural_scroll = false
    accel_profile = adaptive
}

plugin {
  hyprbars {
        bar_height = 32
        bar_color = $background
        col.text = $foreground
        bar_text_size = 12
        bar_text_font = JetBrainsMono Nerd Font Mono
        bar_button_padding = 8
        bar_padding = 16
        bar_precedence_over_border = true

        bar_buttons_alignment = left
        hyprbars-button = $red, 16, 󰖭, hyprctl dispatch killactive
        hyprbars-button = $purple, 16, , hyprctl dispatch fullscreen 1
    }
}

gesture = 3, horizontal, workspace

# app launchers: focus existing window if open, else launch
$fol = ~/.config/hypr/scripts/focus-or-launch.sh
bind = CONTROL ALT, Return, exec, $fol ghostty $terminal
bind = CONTROL ALT, Q, exec, $terminal
bind = CONTROL ALT, C, exec, $fol firefox firefox
bind = CONTROL ALT, D, exec, $fol discord flatpak run com.discordapp.Discord
bind = CONTROL ALT, M, exec, $fol spotify spotify-launcher
bind = CONTROL ALT, R, exec, $fol RuneLite flatpak run com.adamcake.Bolt
bind = CONTROL ALT, S, exec, $fol steam steam
bind = SUPER, SPACE, exec, $menu
bind = $mainMod SHIFT, Q, exec, pactl set-sink-mute @DEFAULT_SINK@ 1 && hyprlock
bind = SUPER CONTROL, Q, exec, hyprlock
bind = $mainMod, ESCAPE, exec, hyprshutdown --top-label "Shutting down..." --post-cmd "systemctl poweroff"

bind = SUPER, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod SHIFT, SPACE, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, W, togglegroup,
bind = $mainMod, E, layoutmsg, togglesplit
bind = $mainMod SHIFT, C, exec, hyprctl reload

# macOS-style clipboard/select/undo (terminal-aware: plain CTRL+C would be SIGINT)
bind = SUPER, C, exec, ~/.config/hypr/scripts/macos-keys.sh copy
bind = SUPER, V, exec, ~/.config/hypr/scripts/macos-keys.sh paste
bind = SUPER, X, exec, ~/.config/hypr/scripts/macos-keys.sh cut
bind = SUPER, A, exec, ~/.config/hypr/scripts/macos-keys.sh selectall
bind = SUPER, Z, exec, ~/.config/hypr/scripts/macos-keys.sh undo

bind = SUPER, PERIOD, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy
bind = SUPER, P, exec, hyprpicker -a

bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

bind = CONTROL ALT, H, movewindow, l
bind = CONTROL ALT, J, movewindow, d
bind = CONTROL ALT, K, movewindow, u
bind = CONTROL ALT, L, movewindow, r
bind = SUPER SHIFT, 4, exec, flatpak run org.flameshot.Flameshot gui
bind = $mainMod SHIFT, W, movewindow, mon:+1
bind = $mainMod SHIFT, S, movewindow, mon:-1

bind = $mainMod SHIFT, H, resizeactive, -25 0
bind = $mainMod SHIFT, J, resizeactive, 0 25
bind = $mainMod SHIFT, K, resizeactive, 0 -25
bind = $mainMod SHIFT, L, resizeactive, 25 0

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindl = ,XF86AudioNext, exec, playerctl next
bindl = ,XF86AudioPause, exec, playerctl play-pause
bindl = ,XF86AudioPlay, exec, playerctl play-pause
bindl = ,XF86AudioPrev, exec, playerctl previous

windowrule = match:class .*, suppress_event maximize
windowrule = match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0, no_focus 1
