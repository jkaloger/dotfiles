<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Design Review</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --fg:#e6e8ec; --mut:#9aa3b2; --accent:#4f8cff; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,system-ui,sans-serif; background:var(--bg); color:var(--fg); display:grid; grid-template-columns:260px 1fr; height:100vh; }
  nav { background:var(--panel); border-right:1px solid var(--line); overflow:auto; padding:12px; }
  nav h1 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--mut); margin:0 0 8px; }
  nav .lvl { font-size:11px; text-transform:uppercase; color:var(--mut); margin:14px 0 4px; }
  nav button { display:block; width:100%; text-align:left; background:none; border:0; color:var(--fg); padding:6px 8px; border-radius:6px; cursor:pointer; }
  nav button:hover { background:#20242e; }
  nav button.active { background:var(--accent); color:#fff; }
  main { overflow:auto; padding:20px 24px; }
  .head { display:flex; align-items:baseline; gap:12px; }
  .head h2 { margin:0; }
  .tag { font-size:11px; text-transform:uppercase; color:var(--mut); border:1px solid var(--line); padding:2px 6px; border-radius:99px; }
  .modes { margin:14px 0; display:flex; gap:8px; align-items:center; }
  .modes button { background:var(--panel); border:1px solid var(--line); color:var(--fg); padding:5px 10px; border-radius:6px; cursor:pointer; }
  .modes button.on { border-color:var(--accent); color:var(--accent); }
  .stage { position:relative; background:#000; border:1px solid var(--line); border-radius:8px; overflow:auto; }
  .stage img { display:block; max-width:100%; }
  .side { display:grid; grid-template-columns:1fr 1fr; gap:2px; }
  .side figure { margin:0; }
  .side figcaption { font-size:11px; color:var(--mut); padding:4px 8px; background:var(--panel); }
  .overlay { position:relative; }
  .overlay .top { position:absolute; top:0; left:0; width:100%; }
  .diff .top { mix-blend-mode:difference; }
  .cols { display:grid; grid-template-columns:1fr 320px; gap:20px; margin-top:14px; }
  .findings li { margin-bottom:8px; }
  .sev { font-size:10px; text-transform:uppercase; padding:1px 6px; border-radius:99px; margin-right:6px; }
  .sev.critical,.sev.high { background:#5b1a1a; color:#ffb3b3; }
  .sev.medium { background:#5b451a; color:#ffd9a3; }
  .sev.low,.sev.info { background:#1a3b5b; color:#a3d1ff; }
  textarea { width:100%; min-height:120px; background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:8px; }
  select,.exp { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px; }
  .exp { cursor:pointer; margin-top:8px; }
  label { display:block; font-size:11px; text-transform:uppercase; color:var(--mut); margin:12px 0 4px; }
  input[type=range] { width:100%; }
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="main"></main>

<!-- capture.mjs / the skill injects the manifest here (see SKILL.md build step). -->
<script type="application/json" id="review-data">/*__REVIEW_DATA__*/</script>
<script>
const raw = document.getElementById("review-data").textContent.trim();
const data = raw.startsWith("/*") ? { sets: [], baseUrl: "" } : JSON.parse(raw);
const sets = data.sets ?? [];
let cur = 0, mode = "side", vp = null;
const FB = "design-review:" + (data.baseUrl || location.pathname);
const store = JSON.parse(localStorage.getItem(FB) || "{}");

function viewportsFor(s){ return Object.keys(s.actual || {}); }

function renderNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = "<h1>Design Review</h1>";
  const levels = {};
  sets.forEach((s,i)=>{ (levels[s.level||"page"] ??= []).push([s,i]); });
  for (const [lvl, items] of Object.entries(levels)){
    const h = document.createElement("div"); h.className="lvl"; h.textContent=lvl; nav.appendChild(h);
    for (const [s,i] of items){
      const b=document.createElement("button"); b.textContent=s.label||s.id;
      if(i===cur) b.className="active"; b.onclick=()=>{cur=i;vp=null;render();};
      nav.appendChild(b);
    }
  }
}

function stage(s){
  const vps = viewportsFor(s); if(!vp||!vps.includes(vp)) vp = vps[0];
  const actual = s.actual?.[vp], intended = s.intended;
  if (mode==="side") return `<div class="side stage">
    <figure><figcaption>Actual (${vp})</figcaption><img src="${actual||""}"></figure>
    <figure><figcaption>Intended</figcaption><img src="${intended||""}"></figure></div>`;
  const blend = mode==="diff" ? "diff" : "";
  return `<div class="stage overlay ${blend}">
    <img src="${intended||""}">
    <img class="top" id="topimg" src="${actual||""}" style="opacity:.5">
    </div>
    <label>Actual opacity</label><input type="range" min="0" max="1" step="0.01" value="0.5"
      oninput="document.getElementById('topimg').style.opacity=this.value">`;
}

function render(){
  renderNav();
  const s = sets[cur]; if(!s){ document.getElementById("main").innerHTML="<p>No sets.</p>"; return; }
  const vps = viewportsFor(s);
  const fb = store[s.id] || { note:"", severity:"" };
  const findings = (s.findings||[]).map(f=>
    `<li><span class="sev ${f.severity}">${f.severity}</span>${f.message}
     ${f.expected?`<br><small>expected <code>${f.expected}</code> · actual <code>${f.actual||"?"}</code></small>`:""}</li>`).join("");
  document.getElementById("main").innerHTML = `
    <div class="head"><h2>${s.label||s.id}</h2><span class="tag">${s.level||"page"}</span></div>
    <div class="modes">
      ${["side","overlay","diff"].map(m=>`<button class="${m===mode?"on":""}" onclick="mode='${m}';render()">${m}</button>`).join("")}
      ${vps.length>1?`<select onchange="vp=this.value;render()">${vps.map(v=>`<option ${v===vp?"selected":""}>${v}</option>`).join("")}</select>`:""}
    </div>
    ${stage(s)}
    <div class="cols">
      <div><label>Agent findings</label><ul class="findings">${findings||"<li><small>none</small></li>"}</ul></div>
      <div>
        <label>Your feedback</label>
        <textarea id="note" placeholder="Component / page / interaction notes…">${fb.note}</textarea>
        <label>Severity</label>
        <select id="sev">${["","blocker","major","minor","nit"].map(x=>`<option ${x===fb.severity?"selected":""}>${x}</option>`).join("")}</select>
        <button class="exp" onclick="save()">Save this note</button>
        <button class="exp" onclick="exportMd()">Export all feedback (audit md)</button>
      </div>
    </div>`;
}

function save(){
  const s=sets[cur];
  store[s.id]={ note:document.getElementById("note").value, severity:document.getElementById("sev").value };
  localStorage.setItem(FB, JSON.stringify(store));
}

function exportMd(){
  save();
  const sevMap={blocker:"critical",major:"high",minor:"medium",nit:"low"};
  let md=`## Findings\n\n`; let n=0;
  for(const s of sets){
    const fb=store[s.id]; if(!fb||!fb.note) continue;
    n++;
    md+=`### Finding ${n}: ${s.label||s.id}\n\n`+
        `**Severity:** ${sevMap[fb.severity]||"info"}\n`+
        `**Location:** ${s.level||"page"} — ${s.route||s.id}\n`+
        `**Description:** ${fb.note}\n`+
        `**Recommendation:** _(fill in)_\n\n`;
  }
  const blob=new Blob([md||"## Findings\n\n_No manual feedback recorded._\n"],{type:"text/markdown"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="design-review-feedback.md"; a.click();
}

addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"&&cur<sets.length-1){cur++;vp=null;render();}
  if(e.key==="ArrowLeft"&&cur>0){cur--;vp=null;render();}
});
render();
</script>
</body>
</html>
