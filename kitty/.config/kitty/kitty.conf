# Duckbones (mirrors ghostty theme = Duckbones)
foreground            #ebefc0
background            #0e101a
selection_foreground  #0e101a
selection_background  #ebefc0
cursor                #edf2c2
cursor_text_color     #0e101a
color0  #0e101a
color1  #e03600
color2  #5dcd97
color3  #e39500
color4  #00a3cb
color5  #795ccc
color6  #00a3cb
color7  #ebefc0
color8  #444860
color9  #ff4821
color10 #58db9e
color11 #f6a100
color12 #00b4e0
color13 #b3a1e6
color14 #00b4e0
color15 #b3b692

# window
hide_window_decorations titlebar-only
background_opacity      1.0
background_blur         80
window_padding_width    10

# font
font_family JetBrainsMono Nerd Font Mono
font_size   14

# ghostty -> kitty keybinds. \x01 = tmux prefix (ctrl-a)
map ctrl+tab                send_text all \x01n
map cmd+w                   send_text all \x01x
map cmd+n                   send_text all \x01c
map cmd+t                   send_text all \x01c
map cmd+k                   send_text all \x01k
map cmd+j                   send_text all \x01j
map cmd+left                send_text all \x01h
map cmd+right               send_text all \x01l
map cmd+up                  send_text all \x01u
map cmd+down                send_text all \x01b
map cmd+d                   send_text all \x01v
map cmd+shift+d             send_text all \x01S
map cmd+enter               send_text all \x01z
map cmd+,                   send_text all \x01,
map cmd+f                   send_text all \x01F
map cmd+shift+[             send_text all \x01p
map cmd+shift+]             send_text all \x01n
map cmd+shift+n             send_text all \x01N
map cmd+/                   send_text all \x01?
map alt+q                   send_text all \x01d

map cmd+1 send_text all \x011
map cmd+2 send_text all \x012
map cmd+3 send_text all \x013
map cmd+4 send_text all \x014
map cmd+5 send_text all \x015
map cmd+6 send_text all \x016
map cmd+7 send_text all \x017
map cmd+8 send_text all \x018
map cmd+9 send_text all \x019

# inner (remote) tmux over ssh: double prefix targets nested session
map cmd+ctrl+t             send_text all \x01\x01c
map cmd+ctrl+n             send_text all \x01\x01c
map cmd+ctrl+w             send_text all \x01\x01x
map cmd+ctrl+tab           send_text all \x01\x01n
map cmd+ctrl+shift+[       send_text all \x01\x01p
map cmd+ctrl+shift+]       send_text all \x01\x01n
map cmd+ctrl+left          send_text all \x01\x01h
map cmd+ctrl+right         send_text all \x01\x01l
map cmd+ctrl+up            send_text all \x01\x01u
map cmd+ctrl+down          send_text all \x01\x01b
map cmd+ctrl+d             send_text all \x01\x01v
map cmd+ctrl+shift+d       send_text all \x01\x01S
map cmd+ctrl+enter         send_text all \x01\x01z
map cmd+ctrl+f             send_text all \x01\x01F
map cmd+ctrl+1 send_text all \x01\x011
map cmd+ctrl+2 send_text all \x01\x012
map cmd+ctrl+3 send_text all \x01\x013
map cmd+ctrl+4 send_text all \x01\x014
map cmd+ctrl+5 send_text all \x01\x015
map cmd+ctrl+6 send_text all \x01\x016
map cmd+ctrl+7 send_text all \x01\x017
map cmd+ctrl+8 send_text all \x01\x018
map cmd+ctrl+9 send_text all \x01\x019

map shift+enter send_text all \n

# no kitty equivalent (ghostty-only):
#   global:cmd+grave_accent=toggle_quick_terminal  -> kitty has no quick terminal
#   image-storage-limit                            -> no kitty setting
